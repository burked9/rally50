<style>

.year-header {

.year-title {

.rally-badge {
    background: #f0f0f0;

.era-gallery-grid {
    display: grid;

    width: 100%;

    overflow: hidden;
    background-color: #f0f0f0;
    border-radius: 0;
}
.era-gallery-item {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
    cursor: pointer;
}

}

.brochure-link {

}
}

}

    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));

}

<div class="era-container">
    <div class="entry-content" style="max-width: 100%;">
        <h2>Overview</h2>
<p>A curated look back at Rallies 21 - 25 (1996 - 2000).</p>

        <div class="era-nav" id="era-nav-top"></div>

        <div id="era-content-container">
            <div id="loading-indicator" style="text-align:center; padding: 20px;">Loading timeline...</div>
            <div id="era-timeline"></div>
        </div>

        <div class="era-nav" id="era-nav-bottom"></div>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const pathSegments = window.location.pathname.split('/');
                // In archive/eras/1/index.html, the era_num is the segment before 'index.html' (or just the number)
                let eraNum = null;
                for (let i = 0; i < pathSegments.length; i++) {
                    if (pathSegments[i] === 'eras' && i + 1 < pathSegments.length) {
                        eraNum = pathSegments[i + 1];
                        break;
                    }
                }

                if (!eraNum || isNaN(parseInt(eraNum))) {
                    document.getElementById('loading-indicator').innerText = "Could not determine Era from URL.";
                    return;
                }
                
                const currentEra = parseInt(eraNum);
                
                // Populate Navigation
                const navHtml = `
                    <div style="flex: 1; text-align: left;">
                        ${currentEra < 10 ? `<a href="https://burked9.github.io/rally50/archive/eras/${currentEra + 1}/index.html">&larr; Newer Eras</a>` : ''}
                    </div>
                    <div class="nav-center">
                        <a href="https://burked9.github.io/rally50/archive/eras/index.html">Back to All Eras</a>
                    </div>
                    <div style="flex: 1; text-align: right;">
                        ${currentEra > 1 ? `<a href="https://burked9.github.io/rally50/archive/eras/${currentEra - 1}/index.html">Older Eras &rarr;</a>` : ''}
                    </div>
                `;
                document.getElementById('era-nav-top').innerHTML = navHtml;
                document.getElementById('era-nav-bottom').innerHTML = navHtml;

                const dataUrl = `https://burked9.github.io/rally50/data/era_${eraNum}.json`;
                const container = document.getElementById('era-timeline');
                const loading = document.getElementById('loading-indicator');

                fetch(dataUrl)
                    .then(response => {
                        if (!response.ok) throw new Error('Data not found');
                        return response.json();
                    })
                    .then(data => {
                        loading.style.display = 'none';
                        
                        data.years.forEach(yearData => {
                            const section = document.createElement('div');
                            section.className = 'year-section';
                            
                            // Header
                            let html = `
                                <div class="year-header">
                                    <h3 class="year-title">${yearData.year}</h3>
                                    <span class="rally-badge">Rally ${yearData.rally_num}</span>
                                </div>
                            `;
                            
                            // Photos Grid (pick up to 4 random photos on every page load)
                            if (yearData.photos && yearData.photos.length > 0) {
                                const shuffledPhotos = [...yearData.photos];
                                for (let i = shuffledPhotos.length - 1; i > 0; i--) {
                                    const j = Math.floor(Math.random() * (i + 1));
                                    [shuffledPhotos[i], shuffledPhotos[j]] = [shuffledPhotos[j], shuffledPhotos[i]];
                                }
                                const randomPhotos = shuffledPhotos.slice(0, 4);

                                html += `<div class="era-gallery-grid">`;
                                randomPhotos.forEach(photo => {
                                    const thumbUrl = `https://drive.google.com/thumbnail?id=${photo.id}&sz=w400`;
                                    const fullUrl = `https://drive.google.com/uc?export=view&id=${photo.id}`;
                                    html += `
                                        <div class="era-gallery-item-wrapper">
                                            <a href="${fullUrl}" target="_blank">
                                                <img class="era-gallery-item" src="${thumbUrl}" alt="${photo.alt}" loading="lazy">
                                            </a>
                                        </div>
                                    `;
                                });
                                html += `</div>`;
                                const totalPhotos = yearData.photo_count || yearData.photos.length;
                                html += `
                                    <div>
                                        <a href="https://burked9.github.io/rally50/archive/rallies/${yearData.year}/index.html" class="view-all-photos-link">
                                            📸 View All ${totalPhotos} Photos from Rally ${yearData.rally_num} (${yearData.year}) &rarr;
                                        </a>
                                    </div>
                                `;
                            } else {
                                html += `<p><em>No photos available yet for this year.</em></p>`;
                            }
                            // Artifacts
                            if (yearData.artifacts && yearData.artifacts.length > 0) {
                                html += `<h4 class="section-subtitle">Artifacts</h4>`;
                                html += `<div class="artifact-gallery-grid">`;
                                yearData.artifacts.forEach(artifact => {
                                    const imgUrl = `https://burked9.github.io/rally50/images/rallies/${yearData.year}/${artifact}`;
                                    html += `
                                        <a href="${imgUrl}" target="_blank">
                                            <img class="artifact-item" src="${imgUrl}" alt="${artifact}" loading="lazy" title="${artifact}">
                                        </a>
                                    `;
                                });
                                html += `</div>`;
                            }

                            // People, Memories & Snapshots
                            if (yearData.people_items && yearData.people_items.length > 0) {
                                html += `<h4 class="section-subtitle">People, Memories & Snapshots</h4>`;
                                html += `<div class="people-era-grid">`;
                                yearData.people_items.forEach(item => {
                                    const hrefUrl = `https://burked9.github.io/rally50${item.href}`;
                                    const thumbUrl = `https://burked9.github.io/rally50${item.thumb}`;
                                    const extraAttrs = item.is_image ? `data-lightbox="era-people-${yearData.year}" data-title="${item.title.replace(/"/g, '&quot;')}"` : '';
                                    const imgStyle = item.section === 'Rally Photo Collages' ? 'style="object-fit: contain;"' : '';
                                    html += `
                                        <a href="${hrefUrl}" class="people-era-card" ${extraAttrs}>
                                            <img src="${thumbUrl}" alt="${item.title.replace(/"/g, '&quot;')}" loading="lazy" ${imgStyle}>
                                            <div class="people-era-caption">
                                                <span class="people-era-badge">${item.section}</span>
                                                ${item.title}
                                            </div>
                                        </a>
                                    `;
                                });
                                html += `</div>`;
                            }
                            
                            // Brochure Pages
                            if (yearData.brochure_pages && yearData.brochure_pages.length > 0) {
                                html += `<h4 class="section-subtitle">Brochure Highlights</h4>`;
                                html += `<div class="era-gallery-grid">`;
                                yearData.brochure_pages.forEach(page => {
                                    const imgUrl = `https://burked9.github.io/rally50/images/brochures/${yearData.year}/${page}`;
                                    html += `
                                        <div class="era-gallery-item-wrapper" style="background-color: transparent;">
                                            <a href="${imgUrl}" target="_blank">
                                                <img class="era-gallery-item" src="${imgUrl}" style="object-fit: contain;" alt="${page}" loading="lazy" title="${page}">
                                            </a>
                                        </div>
                                    `;
                                });
                                html += `</div>`;
                            }
                            
                            // Full Brochure PDF Link
                            if (yearData.brochure_id) {
                                const brochureUrl = `https://drive.google.com/file/d/${yearData.brochure_id}/view`;
                                html += `
                                    <div style="margin-top: 15px;">
                                        <a href="${brochureUrl}" target="_blank" class="brochure-link">
                                            <span class="brochure-icon">📄</span> 
                                            View ${yearData.year} Full Brochure (PDF)
                                        </a>
                                    </div>
                                `;
                            }
                            
                            section.innerHTML = html;
                            container.appendChild(section);
                        });
                        
                    })
                    .catch(err => {
                        loading.innerText = "Failed to load timeline data. " + err.message;
                    });
            });
        </script>
