<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2023 Rally (No. 46) - IWAI Lough Derg Rally 50</title>
    <link rel="stylesheet" href="https://burked9.github.io/rally50/theme/css/style.css" />
    <!-- Borna font replacement (using system fonts stack mostly, but could use Inter/Roboto as similar) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        :root {
            --font-main: 'Inter', sans-serif;
        }
    </style>
</head>

<body>
    <div class="l-container">
        <header class="l-site-head">
            <a href="https://burked9.github.io/rally50/" class="site-title">
                IWAI Lough Derg Rally 50
            </a>

            <nav>
                <ul class="l-navigation">
                    <li><a href="https://burked9.github.io/rally50/">Home</a></li>
                    <li><a href="https://burked9.github.io/rally50/pages/about.html">About</a></li>
                    <li><a href="https://burked9.github.io/rally50/pages/archive.html">Archive</a></li>
                    <li><a href="https://burked9.github.io/rally50/category/articles.html">Articles</a></li>
                    <li><a href="https://burked9.github.io/rally50/category/announcements.html">Announcements</a></li>
                    <li><a href="https://burked9.github.io/rally50/pages/photos.html">Photos</a></li>
                </ul>
            </nav>
        </header>
    </div>

    <main>
<div class="l-container" style="padding-top: 40px; padding-bottom: 66px;">
    <article class="page l-measure">
        <header>
            <h1 class="h1">2023 Rally (No. 46)</h1>
        </header>
        <div class="entry-content l-stack">
            <h2>Photos</h2>
<div id="rally-46-gallery" class="gallery-grid"></div>

<style>
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px;
    padding: 20px;
  }
  .gallery-item {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: transform 0.3s ease;
    cursor: pointer;
  }
  .gallery-item:hover {
    transform: scale(1.03);
  }
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('rally-46-gallery');

    // Fetch the photo data from the JSON file
    fetch('/data/rally46_photos.json')
        .then(response => response.json())
        .then(rally46Photos => {
            rally46Photos.forEach(photo => {
                // Generate the URL for a large thumbnail (w1000 is good for viewing)
                const imgUrl = `https://drive.google.com/thumbnail?id=${photo.id}&sz=w1000`;
                const fullUrl = `https://drive.google.com/uc?export=view&id=${photo.id}`;

                const imgElement = `
                    <a href="${fullUrl}" target="_blank">
                        <img class="gallery-item" 
                             src="${imgUrl}" 
                             alt="${photo.alt}" 
                             loading="lazy">
                    </a>
                `;
                container.innerHTML += imgElement;
            });
        })
        .catch(error => console.error('Error loading gallery data:', error));
});
</script>

<h2>Documents</h2>
<p><em>No documents yet.</em></p>
        </div>
    </article>
</div>
    </main>

    <footer class="site-footer">
        <div class="l-container">

</body>

</html>
