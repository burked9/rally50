<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2001 Rally (No. 26) - IWAI Lough Derg Rally 50</title>
    <link rel="stylesheet" href="https://burked9.github.io/rally50/theme/css/style.css" />
    <!-- Borna font replacement (using system fonts stack mostly, but could use Inter/Roboto as similar) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        :root {
            --font-main: 'Inter', sans-serif;
        }
    </style>
</head>

<body>
    <div class="l-container">
        <header class="l-site-head">
            <a href="https://burked9.github.io/rally50/" class="site-title">
                IWAI Lough Derg Rally 50
            </a>

            <nav>
                <ul class="l-navigation">
                    <li><a href="https://burked9.github.io/rally50/">Home</a></li>
                    <li><a href="https://burked9.github.io/rally50/pages/about.html">About</a></li>
                    <li><a href="https://burked9.github.io/rally50/pages/archive.html">Archive</a></li>
                    <li><a href="https://burked9.github.io/rally50/category/articles.html">Articles</a></li>
                    <li><a href="https://burked9.github.io/rally50/category/announcements.html">Announcements</a></li>
                    <li><a href="https://burked9.github.io/rally50/pages/photos.html">Photos</a></li>
                </ul>
            </nav>
        </header>
    </div>

    <main>
<div class="l-container">
    <div class="entry-content">
        <h2>Documents</h2>
<p><em>No documents yet.</em></p>

        <h2>Photos</h2>
        <div id="rally-gallery-container">
            <div id="gallery-grid" class="gallery-grid"></div>
            <div id="loading-indicator" style="text-align:center; padding: 20px; display:none;">Loading...</div>
            <button id="load-more-btn" class="load-more-btn" style="display:none;">Load More Photos</button>
        </div>

        <!-- Floating Status Bar -->
        <div id="gallery-status" style="display:none;">
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <div id="status-text">
                <span id="loaded-count">0</span> / <span id="total-count">0</span> Photos
            </div>
            <div style="margin-bottom: 8px;">
                <select id="jump-to-year" onchange="jumpToYear(this.value)"
                    style="width: 100%; padding: 4px; border-radius: 4px; color: #333;">
                    <option value="">Jump to Year...</option>
                </select>
            </div>
            <button id="backToTop" onclick="scrollToTop()">↑ Back to Top</button>
        </div>

        <style>
            .gallery-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                /* Smaller min-width for mobile */
                gap: 5px;
                /* Tighter gap */
                padding: 20px 0;
            }

            .gallery-item-wrapper {
                position: relative;
                width: 100%;
                aspect-ratio: 1/1;
                /* Lock aspect ratio */
                overflow: hidden;
                background-color: #f0f0f0;
                /* Placeholder color before load */
                border-radius: 4px;
                /* Slight rounding */
            }

            .gallery-item {
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: transform 0.3s ease;
                cursor: pointer;
                display: block;
            }

            .gallery-item:hover {
                transform: scale(1.03);
            }

            .load-more-btn {
                display: block;
                margin: 30px auto;
                padding: 12px 30px;
                background-color: #333;
                color: white;
                border: none;
                border-radius: 25px;
                font-size: 1rem;
                cursor: pointer;
                transition: background-color 0.2s;
            }

            .load-more-btn:hover {
                background-color: #555;
            }

            /* Floating Status Bar */
            #gallery-status {
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: rgba(0, 74, 153, 0.9);
                /* Aviation Blue */
                color: white;
                padding: 15px;
                border-radius: 10px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
                font-family: sans-serif;
                z-index: 1000;
                min-width: 160px;
                text-align: center;
                backdrop-filter: blur(5px);
            }

            #progress-container {
                width: 100%;
                background: rgba(255, 255, 255, 0.3);
                height: 6px;
                border-radius: 3px;
                margin-bottom: 8px;
                overflow: hidden;
            }

            #progress-bar {
                width: 0%;
                height: 100%;
                background: #00ffcc;
                /* High visibility contrast */
                transition: width 0.2s;
            }

            #status-text {
                font-size: 0.85rem;
                margin-bottom: 10px;
            }

            #backToTop {
                background: white;
                color: #004a99;
                border: none;
                padding: 6px 12px;
                border-radius: 5px;
                cursor: pointer;
                font-weight: bold;
                width: 100%;
                font-size: 0.9rem;
            }

            #backToTop:hover {
                background: #f0f0f0;
            }

            /* Hide status bar on very small screens if needed, or adjust positioning */
            @media (max-width: 400px) {
                #gallery-status {
                    right: 10px;
                    bottom: 10px;
                    min-width: 140px;
                    padding: 10px;
                }
            }
        </style>

        <script>
        // Global Jump Function
        function jumpToYear(year) {
            if (year) {
                window.location.href = `https://burked9.github.io/rally50/archive/rallies/${year}/index.html`;
            }
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('gallery-grid');
            const loadMoreBtn = document.getElementById('load-more-btn');
            const loadingIndicator = document.getElementById('loading-indicator');
            const statusPanel = document.getElementById('gallery-status');
            const jumpSelect = document.getElementById('jump-to-year');
            
            // Populate Jump to Year Dropdown
            // Range 1975-2027. Gaps: 1979, 2020, 2021
            // Optional: Mark current year as selected.
            // Using page title to guess current year simpler than URL parsing in some contexts
            const pageTitle = "2001 Rally (No. 26)"; 
            const currentYearMatch = pageTitle.match(/^\d{4}/);
            const currentYear = currentYearMatch ? parseInt(currentYearMatch[0]) : 0;
            
            for (let y = 2027; y >= 1975; y--) {
                if (y === 1979 || y === 2020 || y === 2021) continue;
                const option = document.createElement('option');
                option.value = y;
                option.textContent = y;
                if (y === currentYear) option.selected = true;
                jumpSelect.appendChild(option);
            }


            const pathSegments = window.location.pathname.split('/');
            const yearSegment = pathSegments.find(s => /^\d{4}$/.test(s));
            
            if (!yearSegment) {
                console.log("No year found in URL, skipping gallery load.");
                return;
            }
            
            const dataUrl = `https://burked9.github.io/rally50/data/rally_${yearSegment}.json`;
            
            // Pagination Configuration
            const ITEMS_PER_PAGE = 24;
            let allPhotos = [];
            let currentIndex = 0;
            
            // Intersection Observer for counting viewed images
            // We need to track actual NEW viewers. A set of observed IDs is safer.
            let observedIds = new Set();
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.dataset.photoId;
                        if (id && !observedIds.has(id)) {
                            observedIds.add(id);
                            document.getElementById('loaded-count').innerText = observedIds.size;
                            observer.unobserve(entry.target);
                        }
                    }
                });
            }, { threshold: 0.1 });


            function renderBatch() {
                const nextBatch = allPhotos.slice(currentIndex, currentIndex + ITEMS_PER_PAGE);
                
                nextBatch.forEach(photo => {
                    const thumbUrl = `https://drive.google.com/thumbnail?id=${photo.id}&sz=w400`;
                    const fullUrl = `https://drive.google.com/uc?export=view&id=${photo.id}`;
                    
                    const div = document.createElement('div');
                    div.className = 'gallery-item-wrapper';
                    div.innerHTML = `
                        <a href="${fullUrl}" target="_blank">
                            <img class="gallery-item" 
                                 src="${thumbUrl}" 
                                 alt="${photo.alt || 'Rally Photo'}" 
                                 data-photo-id="${photo.id}"
                                 loading="lazy">
                        </a>
                    `;
                    container.appendChild(div);
                    
                    // Observe the image for the "Viewed" counter
                    const img = div.querySelector('img');
                    if(img) observer.observe(img);
                });
                
                currentIndex += nextBatch.length;
                
                if (currentIndex >= allPhotos.length) {
                    loadMoreBtn.style.display = 'none';
                } else {
                    loadMoreBtn.style.display = 'block';
                }
            }

            // Scroll Progress Logic
            window.addEventListener('scroll', function() {
                let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                let scrolled = (winScroll / height) * 100;
                document.getElementById("progress-bar").style.width = scrolled + "%";
            });

            // Fetch Data
            loadingIndicator.style.display = 'block';
            fetch(dataUrl)
                .then(response => {
                    if (!response.ok) {
                        if (response.status === 404) {
                            throw new Error('No photos found for this year.');
                        }
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    allPhotos = data;
                    loadingIndicator.style.display = 'none';
                    
                    if (allPhotos.length > 0) {
                        // Initialize Status Bar
                        document.getElementById('total-count').innerText = allPhotos.length;
                        statusPanel.style.display = 'block';
                        
                        renderBatch();
                    } else {
                        container.innerHTML = '<p>No photos available.</p>';
                    }
                })
                .catch(error => {
                    console.log('Gallery info:', error.message);
                    loadingIndicator.style.display = 'none';
                    // Optional: container.innerHTML = '<p><em>No photos available for this year yet.</em></p>';
                });

            loadMoreBtn.addEventListener('click', renderBatch);
        });
        </script>
    </div>
</div>
    </main>

    <footer class="site-footer">
        <div class="l-container">
            <p>&copy; 2027 IWAI Lough Derg Rally 50. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
