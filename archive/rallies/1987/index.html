<head>
    <meta charset="utf-8" />

    <link rel="stylesheet" href="https://burked9.github.io/rally50/theme/css/style.css" />
    <!-- Borna font replacement (using system fonts stack mostly, but could use Inter/Roboto as similar) -->

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        :root {
            --font-main: 'Inter', sans-serif;
        }
    </style>
</head>

<body>
    <div class="l-container">
        <header class="l-site-head">
            <a href="https://burked9.github.io/rally50/" class="site-title">
                IWAI Lough Derg Rally 50
            </a>

            <nav>
                <ul class="l-navigation">
                    <li><a href="https://burked9.github.io/rally50/">Home</a></li>
                    <li><a href="https://burked9.github.io/rally50/pages/about.html">About</a></li>
                    <li><a href="https://burked9.github.io/rally50/pages/archive.html">Archive</a></li>
                    <li><a href="https://burked9.github.io/rally50/category/articles.html">Articles</a></li>
                    <li><a href="https://burked9.github.io/rally50/category/announcements.html">Announcements</a></li>
                    <li><a href="https://burked9.github.io/rally50/pages/photos.html">Photos</a></li>
                </ul>
            </nav>
        </header>
    </div>

    <main>
<div class="l-container">
    <div class="entry-content">
        <h2>Documents</h2>
<p><em>No documents yet.</em></p>

        <h2>Photos</h2>
        <div id="rally-gallery-container">
            <div id="gallery-grid" class="gallery-grid"></div>
            <div id="loading-indicator" style="text-align:center; padding: 20px; display:none;">Loading...</div>
            <button id="load-more-btn" class="load-more-btn" style="display:none;">Load More Photos</button>
        </div>

        <style>
            .gallery-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                /* Smaller min-width for mobile */
                gap: 5px;
                /* Tighter gap */
                padding: 20px 0;
            }

            .gallery-item-wrapper {
                position: relative;
                width: 100%;
                aspect-ratio: 1/1;
                /* Lock aspect ratio */
                overflow: hidden;
                background-color: #f0f0f0;
                /* Placeholder color before load */
                border-radius: 4px;
                /* Slight rounding */
            }

            .gallery-item {
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: transform 0.3s ease;
                cursor: pointer;
                display: block;
            }

            .gallery-item:hover {
                transform: scale(1.03);
            }

            .load-more-btn {
                display: block;
                margin: 30px auto;
                padding: 12px 30px;
                background-color: #333;
                color: white;
                border: none;
                border-radius: 25px;
                font-size: 1rem;
                cursor: pointer;
                transition: background-color 0.2s;
            }

            .load-more-btn:hover {
                background-color: #555;
            }
        </style>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const container = document.getElementById('gallery-grid');
                const loadMoreBtn = document.getElementById('load-more-btn');
                const loadingIndicator = document.getElementById('loading-indicator');

                // Extract year from URL or metadata. simpler: use the slug or specific logic
                // Assuming URL pattern archive/rallies/YYYY/index.html
                // Or passed via context. But Jinja2 is static.
                // We can determine the year from the page URL for fetching the JSON.
                // URL ends in: .../archive/rallies/2023/index.html

                const pathSegments = window.location.pathname.split('/');
                // Look for a year (4 digits) in the path
                const yearSegment = pathSegments.find(s => /^\d{4}$/.test(s));

                if (!yearSegment) {
                    console.log("No year found in URL, skipping gallery load.");
                    return;
                }

                const dataUrl = `https://burked9.github.io/rally50/data/rally_${yearSegment}.json`;

                // Pagination Configuration
                const ITEMS_PER_PAGE = 24;
                let allPhotos = [];
                let currentIndex = 0;

                function renderBatch() {
                    const nextBatch = allPhotos.slice(currentIndex, currentIndex + ITEMS_PER_PAGE);

                    nextBatch.forEach(photo => {
                        const thumbUrl = `https://drive.google.com/thumbnail?id=${photo.id}&sz=w400`; // Optimization: w400
                        const fullUrl = `https://drive.google.com/uc?export=view&id=${photo.id}`;

                        const itemHtml = `
                    <div class="gallery-item-wrapper">
                        <a href="${fullUrl}" target="_blank">
                            <img class="gallery-item" 
                                 src="${thumbUrl}" 
                                 alt="${photo.alt || 'Rally Photo'}" 
                                 loading="lazy">
                        </a>
                    </div>
                    `;
                        container.innerHTML += itemHtml;
                    });

                    currentIndex += nextBatch.length;

                    // Hide button if no more photos
                    if (currentIndex >= allPhotos.length) {
                        loadMoreBtn.style.display = 'none';
                    } else {
                        loadMoreBtn.style.display = 'block';
                    }
                }

                // Fetch Data
                loadingIndicator.style.display = 'block';
                fetch(dataUrl)
                    .then(response => {
                        if (!response.ok) {
                            if (response.status === 404) {
                                // No data file for this year yet, just fail silently or show message
                                throw new Error('No photos found for this year.');
                            }
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        allPhotos = data;
                        loadingIndicator.style.display = 'none';
                        if (allPhotos.length > 0) {
                            renderBatch();
                        } else {
                            container.innerHTML = '<p>No photos available.</p>';
                        }
                    })
                    .catch(error => {
                        console.log('Gallery info:', error.message);
                        loadingIndicator.style.display = 'none';
                        // Optional: container.innerHTML = '<p><em>No photos available for this year yet.</em></p>';
                    });

                loadMoreBtn.addEventListener('click', renderBatch);
            });
        </script>
    </div>
</div>
    </main>

    <footer class="site-footer">
        <div class="l-container">
            <p>&copy; 2027 IWAI Lough Derg Rally 50. All rights reserved.</p>

</body>

</html>
