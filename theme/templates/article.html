{% extends "base.html" %}

{% block title %}{{ article.title }} - {{ SITENAME }}{% endblock %}

{% block content %}
<div class="l-container" style="padding-top: 40px; padding-bottom: 66px;">
    <article class="article l-measure">
        <header>
            <h1 class="h1">{{ article.title }}</h1>
            <div class="post-meta" style="color: #666; margin-bottom: 20px;">
                <time datetime="{{ article.date }}">{{ article.date|strftime('%d %B %Y') }}</time>
                {% if article.category %}
                <span class="category">in <a href="{{ SITEURL }}/{{ article.category.url }}">{{ article.category
                        }}</a></span>
                {% endif %}
            </div>
        </header>
        <div class="entry-content l-stack">
            {{ article.content }}
        </div>
    </article>
</div>
{% endblock %}
