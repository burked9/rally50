<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ SITEURL }}/theme/images/logo.png">
    <link rel="apple-touch-icon" href="{{ SITEURL }}/theme/images/logo.png">
    <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css" />
    <!-- Geist font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- Lightbox2 CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet" />
    <style>
        :root {
            --font-main: 'Geist', sans-serif;
        }
        body {
            background-image: linear-gradient(rgba(255,255,255,0.85), rgba(255,255,255,0.95)), url('{{ SITEURL }}/theme/images/hero_background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        /* Quick Navigation Sidebar */
        #quick-nav {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }
        #quick-nav a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            border: 1px solid #eee;
        }
        #quick-nav a:hover {
            background-color: #333;
            color: #fff;
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <!-- Floating Quick Navigation Sidebar -->
    <nav id="quick-nav">
        <a href="{{ SITEURL }}/" title="Home">Ho</a>
        <a href="{{ SITEURL }}/pages/about.html" title="About">Ab</a>
        <a href="{{ SITEURL }}/archive/eras/index.html" title="Eras">Er</a>
        <a href="{{ SITEURL }}/archive/rallies/index.html" title="Rallies">Ra</a>
        <a href="{{ SITEURL }}/archive/artifacts/index.html" title="Artifacts">Ar</a>
        <a href="{{ SITEURL }}/archive/people/index.html" title="People">Pe</a>
        <a href="{{ SITEURL }}/archive/magazines/index.html" title="Articles">Mg</a>
    </nav>

    <div class="l-container">
        <header class="l-site-head">
            <a href="{{ SITEURL }}/" class="site-title" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
                <img src="{{ SITEURL }}/theme/images/q_cropped.png" alt="Rally 50 Logo" style="height: 90px; width: auto;">
                {{ SITENAME }}
            </a>

            <nav>
                <ul class="l-navigation">
                    {% for title, link in MENUITEMS %}
                    {% if title == 'Archive' %}
                    <li class="dropdown">
                        <a href="{{ SITEURL }}{{ link }}" class="dropbtn">Archive ▾</a>
                        <div class="dropdown-content">
                            <a href="{{ SITEURL }}/archive/eras/index.html">Eras</a>
                            <a href="{{ SITEURL }}/archive/rallies/index.html">Rallies</a>
                            <a href="{{ SITEURL }}/archive/artifacts/index.html">Artifacts</a>
                            <a href="{{ SITEURL }}/archive/people/index.html">People</a>
                        </div>
                    </li>
                    {% else %}
                    <li><a href="{{ SITEURL }}{{ link }}">{{ title }}</a></li>
                    {% endif %}
                    {% endfor %}
                </ul>
            </nav>
        </header>
    </div>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="l-container" style="display: flex; justify-content: space-between; align-items: center;">
            <p>&copy; 2027 {{ SITENAME }}. All rights reserved.</p>
            <a href="{{ SITEURL }}/pages/admin.html" style="color: #ccc; text-decoration: none; font-size: 1.2rem;" title="Admin Portal">⚙️</a>
        </div>
    </footer>
    <!-- Lightbox2 JS (includes jQuery) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox-plus-jquery.min.js"></script>
</body>

</html>
