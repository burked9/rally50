<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css" />
    <!-- Borna font replacement (using system fonts stack mostly, but could use Inter/Roboto as similar) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        :root {
            --font-main: 'Inter', sans-serif;
        }
    </style>
</head>

<body>
    <div class="l-container">
        <header class="l-site-head">
            <a href="{{ SITEURL }}/" class="site-title">
                {{ SITENAME }}
            </a>

            <nav>
                <ul class="l-navigation">
                    {% for title, link in MENUITEMS %}
                    {% if title == 'Archive' %}
                    <li class="dropdown">
                        <a href="{{ SITEURL }}{{ link }}" class="dropbtn">Archive ▾</a>
                        <div class="dropdown-content">
                            <a href="{{ SITEURL }}/archive/rallies/index.html">Rallies</a>
                            <a href="{{ SITEURL }}/archive/artifacts/index.html">Artifacts</a>
                            <a href="{{ SITEURL }}/archive/people/index.html">People</a>
                        </div>
                    </li>
                    {% else %}
                    <li><a href="{{ SITEURL }}{{ link }}">{{ title }}</a></li>
                    {% endif %}
                    {% endfor %}
                </ul>
            </nav>
        </header>
    </div>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="l-container">
            <p>&copy; 2027 {{ SITENAME }}. All rights reserved.</p>
        </div>
    </footer>
</body>

</html>
