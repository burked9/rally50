<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ SITEURL }}/theme/images/favicon.png?v=3">
    <link rel="apple-touch-icon" href="{{ SITEURL }}/theme/images/favicon.png?v=3">
    <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css" />
    <!-- Geist font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-main: 'Geist', sans-serif;
        }
        body {
            background-image: linear-gradient(rgba(255,255,255,0.85), rgba(255,255,255,0.95)), url('{{ SITEURL }}/theme/images/hero_background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>

<body>
    <div class="l-container">
        <header class="l-site-head">
            <a href="{{ SITEURL }}/" class="site-title" style="display: flex; align-items: center; gap: 12px; text-decoration: none;">
                <img src="{{ SITEURL }}/theme/images/logo.png" alt="Rally 50 Logo" style="height: 90px; width: auto;">
                {{ SITENAME }}
            </a>

            <nav>
                <ul class="l-navigation">
                    {% for title, link in MENUITEMS %}
                    {% if title == 'Archive' %}
                    <li class="dropdown">
                        <a href="{{ SITEURL }}{{ link }}" class="dropbtn">Archive ▾</a>
                        <div class="dropdown-content">
                            <a href="{{ SITEURL }}/archive/eras/index.html">Eras</a>
                            <a href="{{ SITEURL }}/archive/rallies/index.html">Rallies</a>
                            <a href="{{ SITEURL }}/archive/artifacts/index.html">Artifacts</a>
                            <a href="{{ SITEURL }}/archive/people/index.html">People</a>
                        </div>
                    </li>
                    {% else %}
                    <li><a href="{{ SITEURL }}{{ link }}">{{ title }}</a></li>
                    {% endif %}
                    {% endfor %}
                </ul>
            </nav>
        </header>
    </div>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="l-container" style="display: flex; justify-content: space-between; align-items: center;">
            <p>&copy; 2027 {{ SITENAME }}. All rights reserved.</p>
            <a href="{{ SITEURL }}/pages/admin.html" style="color: #ccc; text-decoration: none; font-size: 1.2rem;" title="Admin Portal">⚙️</a>
        </div>
    </footer>
</body>

</html>
