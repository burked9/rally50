{% extends "page.html" %}

{% block content %}
<style>
/* Full width override */
main {
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
}
.era-container {
    width: 100%;
    max-width: 1200px;
    padding: 0 40px;
    margin: 0 auto;
}
.year-section {
    margin-bottom: 60px;
    padding-bottom: 40px;
    border-bottom: 1px solid #eaeaea;
}
.year-section:last-child {
    border-bottom: none;
}
.year-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}
.year-title {
    font-size: 2.5rem;
    font-weight: 700;
    margin: 0;
    color: #004a99;
}
.rally-badge {
    background: #f0f0f0;
    color: #555;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 1rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.era-gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 0px;
    margin-bottom: 20px;
}
.era-gallery-item-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 1/1;
    overflow: hidden;
    background-color: #f0f0f0;
    border-radius: 0;
}
.era-gallery-item {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
    cursor: pointer;
}
.era-gallery-item:hover {
    transform: scale(1.05);
}

.brochure-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #fdfdfd;
    border: 1px solid #ccc;
    padding: 12px 20px;
    border-radius: 8px;
    text-decoration: none;
    color: #333;
    font-weight: 600;
    transition: background 0.2s, box-shadow 0.2s;
}
}
.brochure-icon {
    font-size: 1.2rem;
}
.artifact-gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 15px;
    margin-top: 15px;
}
.artifact-item {
    width: 100%;
    height: 150px;
    object-fit: contain;
    background-color: #fafafa;
    border: 1px solid #ddd;
    border-radius: 8px;
}
.section-subtitle {
    font-size: 1.2rem;
    color: #444;
    margin: 30px 0 10px 0;
    border-bottom: 2px solid #eee;
    padding-bottom: 5px;
}
</style>

<style>
.era-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0;
    margin: 20px 0;
    border-top: 1px solid #eaeaea;
    border-bottom: 1px solid #eaeaea;
}
.era-nav a {
    text-decoration: none;
    font-weight: 600;
    color: #004a99;
    padding: 8px 16px;
    border-radius: 4px;
    transition: background 0.2s;
}
.era-nav a:hover {
    background: #f0f0f0;
}
.era-nav .nav-center {
    flex-grow: 1;
    text-align: center;
}
</style>

<div class="era-container">
    <div class="entry-content" style="max-width: 100%;">
        {{ page.content }}

        <div class="era-nav" id="era-nav-top"></div>

        <div id="era-content-container">
            <div id="loading-indicator" style="text-align:center; padding: 20px;">Loading timeline...</div>
            <div id="era-timeline"></div>
        </div>

        <div class="era-nav" id="era-nav-bottom"></div>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const pathSegments = window.location.pathname.split('/');
                // In archive/eras/1/index.html, the era_num is the segment before 'index.html' (or just the number)
                let eraNum = null;
                for (let i = 0; i < pathSegments.length; i++) {
                    if (pathSegments[i] === 'eras' && i + 1 < pathSegments.length) {
                        eraNum = pathSegments[i + 1];
                        break;
                    }
                }

                if (!eraNum || isNaN(parseInt(eraNum))) {
                    document.getElementById('loading-indicator').innerText = "Could not determine Era from URL.";
                    return;
                }
                
                const currentEra = parseInt(eraNum);
                
                // Populate Navigation
                const navHtml = `
                    <div style="flex: 1; text-align: left;">
                        ${currentEra < 10 ? `<a href="{{ SITEURL }}/archive/eras/${currentEra + 1}/index.html">&larr; Newer Eras</a>` : ''}
                    </div>
                    <div class="nav-center">
                        <a href="{{ SITEURL }}/archive/eras/index.html">Back to All Eras</a>
                    </div>
                    <div style="flex: 1; text-align: right;">
                        ${currentEra > 1 ? `<a href="{{ SITEURL }}/archive/eras/${currentEra - 1}/index.html">Older Eras &rarr;</a>` : ''}
                    </div>
                `;
                document.getElementById('era-nav-top').innerHTML = navHtml;
                document.getElementById('era-nav-bottom').innerHTML = navHtml;

                const dataUrl = `{{ SITEURL }}/data/era_${eraNum}.json`;
                const container = document.getElementById('era-timeline');
                const loading = document.getElementById('loading-indicator');

                fetch(dataUrl)
                    .then(response => {
                        if (!response.ok) throw new Error('Data not found');
                        return response.json();
                    })
                    .then(data => {
                        loading.style.display = 'none';
                        
                        data.years.forEach(yearData => {
                            const section = document.createElement('div');
                            section.className = 'year-section';
                            
                            // Header
                            let html = `
                                <div class="year-header">
                                    <h3 class="year-title">${yearData.year}</h3>
                                    <span class="rally-badge">Rally ${yearData.rally_num}</span>
                                </div>
                            `;
                            
                            // Photos Grid
                            if (yearData.photos && yearData.photos.length > 0) {
                                html += `<div class="era-gallery-grid">`;
                                yearData.photos.forEach(photo => {
                                    const thumbUrl = `https://drive.google.com/thumbnail?id=${photo.id}&sz=w400`;
                                    const fullUrl = `https://drive.google.com/uc?export=view&id=${photo.id}`;
                                    html += `
                                        <div class="era-gallery-item-wrapper">
                                            <a href="${fullUrl}" target="_blank">
                                                <img class="era-gallery-item" src="${thumbUrl}" alt="${photo.alt}" loading="lazy">
                                            </a>
                                        </div>
                                    `;
                                });
                                html += `</div>`;
                            } else {
                                html += `<p><em>No photos available yet for this year.</em></p>`;
                            }
                            // Artifacts
                            if (yearData.artifacts && yearData.artifacts.length > 0) {
                                html += `<h4 class="section-subtitle">Artifacts</h4>`;
                                html += `<div class="artifact-gallery-grid">`;
                                yearData.artifacts.forEach(artifact => {
                                    const imgUrl = `{{ SITEURL }}/images/rallies/${yearData.year}/${artifact}`;
                                    html += `
                                        <a href="${imgUrl}" target="_blank">
                                            <img class="artifact-item" src="${imgUrl}" alt="${artifact}" loading="lazy" title="${artifact}">
                                        </a>
                                    `;
                                });
                                html += `</div>`;
                            }
                            
                            // Brochure Pages
                            if (yearData.brochure_pages && yearData.brochure_pages.length > 0) {
                                html += `<h4 class="section-subtitle">Brochure Highlights</h4>`;
                                html += `<div class="era-gallery-grid">`;
                                yearData.brochure_pages.forEach(page => {
                                    const imgUrl = `{{ SITEURL }}/images/brochures/${yearData.year}/${page}`;
                                    html += `
                                        <div class="era-gallery-item-wrapper" style="background-color: transparent;">
                                            <a href="${imgUrl}" target="_blank">
                                                <img class="era-gallery-item" src="${imgUrl}" style="object-fit: contain;" alt="${page}" loading="lazy" title="${page}">
                                            </a>
                                        </div>
                                    `;
                                });
                                html += `</div>`;
                            }
                            
                            // Full Brochure PDF Link
                            if (yearData.brochure_id) {
                                const brochureUrl = `https://drive.google.com/file/d/${yearData.brochure_id}/view`;
                                html += `
                                    <div style="margin-top: 15px;">
                                        <a href="${brochureUrl}" target="_blank" class="brochure-link">
                                            <span class="brochure-icon">📄</span> 
                                            View ${yearData.year} Full Brochure (PDF)
                                        </a>
                                    </div>
                                `;
                            }
                            
                            section.innerHTML = html;
                            container.appendChild(section);
                        });
                        
                    })
                    .catch(err => {
                        loading.innerText = "Failed to load timeline data. " + err.message;
                    });
            });
        </script>
    </div>
</div>
{% endblock %}
