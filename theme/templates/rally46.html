{% extends "page.html" %}

{% block content %}
<div class="l-container">
    <div class="entry-content">
        <p>A selection of photos from the 2023 Rally. Click to view larger.</p>

        <div id="rally-46-gallery" class="gallery-grid"></div>

        <style>
            .gallery-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 15px;
                padding: 20px 0;
                /* Adjusted padding */
            }

            .gallery-item {
                width: 100%;
                height: 200px;
                object-fit: cover;
                border-radius: 8px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                transition: transform 0.3s ease;
                cursor: pointer;
                display: block;
                /* Ensure no inline spacing gaps */
            }

            .gallery-item:hover {
                transform: scale(1.03);
            }
        </style>

        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const container = document.getElementById('rally-46-gallery');
                const dataUrl = '{{ SITEURL }}/data/rally46_photos.json';

                // Fetch the photo data from the JSON file
                fetch(dataUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(rally46Photos => {
                        rally46Photos.forEach(photo => {
                            // Generate the URL for a large thumbnail (w1000 is good for viewing)
                            const imgUrl = `https://drive.google.com/thumbnail?id=${photo.id}&sz=w1000`;
                            const fullUrl = `https://drive.google.com/uc?export=view&id=${photo.id}`;

                            const imgElement = `
                            <a href="${fullUrl}" target="_blank">
                                <img class="gallery-item" 
                                     src="${imgUrl}" 
                                     alt="${photo.alt || 'Rally Photo'}" 
                                     loading="lazy">
                            </a>
                        `;
                            container.innerHTML += imgElement;
                        });
                    })
                    .catch(error => {
                        console.error('Error loading gallery data:', error);
                        container.innerHTML = '<p>Error loading photos. Please try refreshing the page.</p>';
                    });
            });
        </script>

        <h2>Documents</h2>
        <p><em>No documents yet.</em></p>
    </div>
</div>
{% endblock %}
