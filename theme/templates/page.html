{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ SITENAME }}{% endblock %}

{% block content %}
<div class="l-container" style="padding-top: 40px; padding-bottom: 66px;">
    <article class="page l-measure">
        <header>
            <h1 class="h1">{{ page.title }}</h1>
        </header>
        <div class="entry-content l-stack">
            {{ page.content }}
        </div>
    </article>
</div>
{% endblock %}
