name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site
        run: |
            pelican content -o output -s publishconf.py
            touch output/.nojekyll

      - name: Deploy to GitHub Pages (Internal Working Site)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output

      - name: Build Public Splash Site (loughdergrally50.com)
        run: |
            pelican content -o output_public -s publishconf_public.py
            touch output_public/.nojekyll

      - name: Deploy to Public GitHub Pages (loughdergrally50-public)
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PUBLIC_DEPLOY_TOKEN }}
          external_repository: burked9/loughdergrally50-public
          publish_branch: gh-pages
          publish_dir: ./output_public
          cname: www.loughdergrally50.com

